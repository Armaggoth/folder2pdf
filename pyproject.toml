[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folder2pdf"
version = "0.1.0"
description = "Create PDFs from images in folders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Carlos Delgado" }
]
dependencies = [
  "img2pdf>=0.6.3",
  "pypdf>=6.14.2"
]

[project.scripts]
folder2pdf = "folder2pdf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
